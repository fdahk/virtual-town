server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 读档 POST JSON 可能很大（多场景 tiles + 全员长期记忆），默认 1MB 会 413
    # 修改后需重建 frontend 镜像：docker compose -f docker-compose.demo.yml build frontend
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback：所有未匹配路由交给 React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理 REST API → backend 容器（Docker 内部 DNS）
    location /api/ {
        # 与 server 一致，部分环境需在 location 内显式声明才对新大文件生效
        client_max_body_size 512m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # 代理 WebSocket → backend 容器
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
