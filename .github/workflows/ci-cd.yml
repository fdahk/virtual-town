# CI：push / PR 到 main 时跑后端 pytest + 前端 lint/build。
# CD：仅 push 到 main 且测试全绿后，生成 .env（Secrets）→ SCP 到服务器 → SSH 执行 deploy_remote.sh
#
# Secrets 清单见 .github/DEPLOY_SECRETS.md

name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vt_ci
          POSTGRES_PASSWORD: vt_ci_pass
          POSTGRES_DB: virtual_town_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vt_ci -d virtual_town_test"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Alembic upgrade (test database)
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://vt_ci:vt_ci_pass@localhost:5432/virtual_town_test
        run: alembic upgrade head

      - name: Pytest
        env:
          LLM_API_KEY: ""
          TEST_DATABASE_URL: postgresql+asyncpg://vt_ci:vt_ci_pass@localhost:5432/virtual_town_test
          TEST_DATABASE_URL_SYNC: postgresql+psycopg://vt_ci:vt_ci_pass@localhost:5432/virtual_town_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q --tb=short

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck + production build
        run: npm run build

  deploy:
    name: Deploy to server
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}" || { echo "缺少 secret: DEPLOY_SSH_PRIVATE_KEY" >&2; exit 1; }
          test -n "${DEPLOY_HOST:-}" || { echo "缺少 secret: DEPLOY_HOST" >&2; exit 1; }
          test -n "${DEPLOY_USER:-}" || { echo "缺少 secret: DEPLOY_USER" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Render .env on runner
        env:
          DEPLOY_POSTGRES_PASSWORD: ${{ secrets.DEPLOY_POSTGRES_PASSWORD }}
          DEPLOY_LLM_API_KEY: ${{ secrets.DEPLOY_LLM_API_KEY }}
          DEPLOY_CORS_ORIGIN: ${{ secrets.DEPLOY_CORS_ORIGIN }}
          DEPLOY_BACKEND_PUBLIC_URL: ${{ secrets.DEPLOY_BACKEND_PUBLIC_URL }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_POSTGRES_PASSWORD:-}" || { echo "缺少 secret: DEPLOY_POSTGRES_PASSWORD" >&2; exit 1; }
          python scripts/write_deploy_env.py /tmp/virtual-town.env

      # 同步代码到服务器（不要求 DEPLOY_PATH 为 git clone；与 deploy_remote.sh 中 DEPLOY_SKIP_GIT=1 配合）
      - name: Sync repository to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/node_modules/' \
            --exclude '__pycache__/' \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'frontend/dist/' \
            --exclude '*.egg-info/' \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      # 参考 paaawow_backend：appleboy/ssh-action 可拉长时间；其默认 command_timeout 仅 10m，
      # 首次/无缓存 docker build 容易在「已起 postgres/redis、尚未 up backend」处被掐断，表现为只剩数据层容器。
      - name: Upload .env to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_PATH:-}" || { echo "缺少 secret: DEPLOY_PATH" >&2; exit 1; }
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            /tmp/virtual-town.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env"

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # 与 rsync 共用 Configure SSH 步骤写入的私钥与 known_hosts（accept-new）
          key_path: /home/runner/.ssh/deploy_key
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            export DEPLOY_SKIP_GIT=1
            CMF='${{ secrets.DEPLOY_COMPOSE_FILE }}'
            export COMPOSE_FILE="${CMF:-docker-compose.demo.yml}"
            cd "$DEPLOY_PATH"
            test -f scripts/deploy_remote.sh
            bash scripts/deploy_remote.sh
