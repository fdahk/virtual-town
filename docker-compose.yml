services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vt_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_town}
      POSTGRES_USER: ${POSTGRES_USER:-virtual_town}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_town_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-virtual_town}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vt_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vt_backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # 阶段 12：API 进程只负责 enqueue，消费由下面独立的 `worker` 容器跑 RQ worker。
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # RQ worker：消费 `agent_decision / write_memory_embedding / daily_reflection` 等
  # 异步任务（见 docs/实施方案/MVP开发任务拆分.md §12、事件系统与任务调度方案 §2）。
  # 扩容直接调 `docker compose up --scale worker=N`；每个副本自动竞争消费。
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vt_worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.domain.tasks.worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vt_frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
