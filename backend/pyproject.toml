[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-town-backend"
version = "0.1.0"
description = "AI 小镇后端：FastAPI + PostgreSQL/pgvector + Redis + WebSocket"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  # Web
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<0.40",
  "websockets>=12",
  "python-multipart>=0.0.9",
  # 配置
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  # 数据库
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.31",
  "psycopg[binary]>=3.1,<3.3",
  "alembic>=1.13,<1.17",
  "pgvector>=0.3,<0.5",
  # Redis / 队列（MVP：RQ；预留切换到 Celery）
  "redis>=5.0,<6",
  "rq>=1.16,<2",
  # HTTP / LLM
  "httpx>=0.27,<0.29",
  "tenacity>=8,<9",
  # 工具
  "numpy>=1.26,<3",
  "orjson>=3.10,<4",
  "python-dateutil>=2.9,<3",
  "loguru>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
